name: .NET Desktop Build

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    env:
      Solution_Name: WLauncher.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore WLauncher.sln

    - name: Publish Windows x64
      run: dotnet publish WLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish/win-x64

    - name: Upload Windows x64
      uses: actions/upload-artifact@v4
      with:
        name: WLauncher-Windows-x64
        path: publish/win-x64
        retention-days: 14

  build-linux:
    runs-on: ubuntu-latest
    
    env:
      Solution_Name: WLauncher.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore WLauncher.sln

    - name: Publish Linux x64
      run: dotnet publish WLauncher.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish/linux-x64

    - name: Publish Linux ARM64
      run: dotnet publish WLauncher.csproj -c Release -r linux-arm64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish/linux-arm64

    - name: Upload Linux x64
      uses: actions/upload-artifact@v4
      with:
        name: WLauncher-Linux-x64
        path: publish/linux-x64
        retention-days: 14

    - name: Upload Linux ARM64
      uses: actions/upload-artifact@v4
      with:
        name: WLauncher-Linux-ARM64
        path: publish/linux-arm64
        retention-days: 14

  build-macos:
    runs-on: macos-latest
    
    env:
      Solution_Name: WLauncher.sln
      App_Name: WLauncher

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore WLauncher.sln

    - name: Publish macOS x64
      run: dotnet publish WLauncher.csproj -c Release -r osx-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish/osx-x64

    - name: Create macOS .app bundle
      run: |
        APP_BUNDLE="publish/${{ env.App_Name }}.app"
        mkdir -p "$APP_BUNDLE/Contents/MacOS"
        mkdir -p "$APP_BUNDLE/Contents/Resources"
        
        # Copy all published files to the app bundle
        cp -r publish/osx-x64/* "$APP_BUNDLE/Contents/MacOS/"
        
        # Make the executable... executable
        chmod +x "$APP_BUNDLE/Contents/MacOS/${{ env.App_Name }}"
        
        # Create Info.plist
        cat > "$APP_BUNDLE/Contents/Info.plist" << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>${{ env.App_Name }}</string>
            <key>CFBundleIdentifier</key>
            <string>com.wlauncher</string>
            <key>CFBundleName</key>
            <string>${{ env.App_Name }}</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.15</string>
            <key>NSHighResolutionCapable</key>
            <true/>
        </dict>
        </plist>
        EOF

    - name: Upload macOS x64
      uses: actions/upload-artifact@v4
      with:
        name: WLauncher-macOS-x64
        path: publish/${{ env.App_Name }}.app
        retention-days: 14

  create-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows x64
        uses: actions/download-artifact@v4
        with:
          name: WLauncher-Windows-x64
          path: publish/win-x64
      - name: Download Linux x64
        uses: actions/download-artifact@v4
        with:
          name: WLauncher-Linux-x64
          path: publish/linux-x64
      - name: Download Linux ARM64
        uses: actions/download-artifact@v4
        with:
          name: WLauncher-Linux-ARM64
          path: publish/linux-arm64
      - name: Download macOS x64
        uses: actions/download-artifact@v4
        with:
          name: WLauncher-macOS-x64
          path: publish/osx-x64/WLauncher.app

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Archive artifacts
        run: |
          cd publish/win-x64 && zip -r ../../WLauncher-Windows-x64.zip * && cd ../..
          cd publish/linux-x64 && tar -czf ../../WLauncher-Linux-x64.tar.gz * && cd ../..
          cd publish/linux-arm64 && tar -czf ../../WLauncher-Linux-ARM64.tar.gz * && cd ../..
          cd publish/osx-x64 && zip -r ../../WLauncher-macOS-x64.zip WLauncher.app && cd ../..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WLauncher-Windows-x64.zip
            WLauncher-Linux-x64.tar.gz
            WLauncher-Linux-ARM64.tar.gz
            WLauncher-macOS-x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}